[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "repopilot"
version = "0.1.0"
description = "Evidence-first Python repository issue localization with LangGraph and DeepSeek"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "pydantic>=2.8,<3", "python-dotenv>=1,<2", "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4", "sqlalchemy>=2,<3", "pgvector>=0.3,<1",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
semantic = ["sentence-transformers>=3,<6"]
postgres-checkpoint = ["langgraph-checkpoint-postgres>=3,<4"]

[project.scripts]
repopilot = "repopilot.cli:main"

[tool.setuptools.packages.find]
include = ["repopilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
