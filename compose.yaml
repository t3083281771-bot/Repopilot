services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: repopilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repopilot-local}
      POSTGRES_DB: repopilot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repopilot"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      DATABASE_URL: postgresql://repopilot:${POSTGRES_PASSWORD:-repopilot-local}@db:5432/repopilot
      MODEL_PROVIDER: ${MODEL_PROVIDER:-demo}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - app_data:/app/runtime
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
  app_data:
